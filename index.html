<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,1000;1,1000&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminder for u</title>
<source src="yey.mp3" type="audio/mpeg">
<img id="mascot" src="axolotlLove.png" alt="axolotl mascot">





<style>
  
button {
  transition: transform 0.2s ease;
}

button:hover {
  transform: scale(1.1);
}

@media (max-width: 500px) {
  h1 {
    font-size: 22px;
    line-height: 1.4;
  }

  button {
    font-size: 14px;
  }
}

body {
  user-select: none;
}

  body {
    font-family: Nunito, sans-serif;
    background-color: #f9d9ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }

  #yesButton, #haveDrinkButton, #noButton {
  font-family: inherit; 
}

  h1 {
    color: #9500a9;
    font-size: 36px;
    font-family: Nunito, sans-serif;
  }
  h2 {
    color: #9500a9;
    font-size: 20px;
    font-family: Nunito, sans-serif;
  }
  h3 {
    color: #9300ad;
    font-size: 30px;
    font-family: Nunito, sans-serif;
  }

  button {
    margin: 5px;
    padding: 10px 15px;
    border: none;
    border-radius: 15px;
    background-color: #ffe7ff;
    color: rgb(156, 0, 133);
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #ff64e8;
  }

h1, h2, h3, button, mascot, #answers {
  animation: appear 1s ease-in;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(-50px); }
  to { opacity: 1; transform: translateY(0); }
}

.heart {
  position: fixed;
  bottom: -50px;
  font-size: 24px;
  animation: floating 6s linear infinite;
}
  
@keyframes floating {
  0% { bottom: -50px; opacity: 0; }
  20% { opacity: 1; }
  100% { bottom: 110%; opacity: 0; }
}

body {
  background: linear-gradient(270deg, #fcbefc, #fc8bf4, #ffd1ff);
  background-size: 600% 600%;
  animation: gradation 8s ease infinite;
}

@keyframes gradation {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.heart {
  position: fixed;
  bottom: -50px;
  font-size: 32px;
  opacity: 0.8;
  animation: floating 5s linear infinite;
  z-index: 0;
}

#noButton {
}

#mascot {
  width: 90px;
  height: auto;
  animation: moving 2s ease-in-out infinite;
}

#answers {
  z-index: 999;
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
  color: #00ab14;
  }


@keyframes moving {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

</style>



</head>
<body>

<h1>Hi Py, this is a daily reminder to drink water only for you</h1>
<h2>hehe</h2>
<h3>Drink water now!!!</h3>
<p style="font-size: 1px; opacity: 0.5; text-align: center; position: fixed; bottom: 0; width: 100%;">
  <a href="https://www.flaticon.com/free-stickers/axolotl" title="axolotl stickers">Axolotl stickers created by Surfsup.Vector - Flaticon</a>
</p>






<audio id="yey" src="yey.mp3" type="audio/mpeg"></audio>

<button id="yesButton">Okay, i will</button> 
<button id="haveDrinkButton">I already drank water!!</button>
<button id="noButton">I don't want to</button>

<p id="answers"></p>

<script>
  

  const yesButton = document.getElementById("yesButton");  
  const haveDrinkButton = document.getElementById("haveDrinkButton");
  const noButton = document.getElementById("noButton"); let percobaan = 0;
  const answers = document.getElementById("answers");
  const mascot = document.getElementById("mascot");


  yesButton.addEventListener("click", function () {
    answers.textContent = "Yeyyyy, mahal na mahal kita Py🥰🥰🥰";
    document.getElementById("yey").play();
    confetti({
      origin: { x: 0.5, y: 1.0 },
      particleCount: 500,
      spread: 160
    });
    mascot.src = "AxolotlLoving.png";
    setTimeout(function () {
      mascot.src = "axolotlLove.png";
    }, 5000);

});

  haveDrinkButton.addEventListener("click", 
  function () {
    answers.textContent = "What??";
    mascot.src = "axolotlDisappointed.png";
    haveDrinkButton.style.transform = "scale(0)"
    setTimeout(function () {
      answers.textContent = "hmmmmm, drink water now Py";
      mascot.src = "axolotlLove.png";
    }, 2000);
  });

  noButton.addEventListener("click", 
  function () {
    answers.textContent = "Aww, why not?🥹🥹🥹 ";
    mascot.src = "axolotlSad.png";
    setTimeout(function () {
      answers.textContent = "Please drink water, Py🥺🥺🥺";
      mascot.src = "axolotlSad.png";
    }, 2000);
  });

  
function escaping(event) {
  event.preventDefault();
  noButton.style.position = "fixed";

    percobaan++;

  const tinyScale = Math.max(0.1, 1 - percobaan * 0.15);
  noButton.style.transform = "scale(" + tinyScale + ")";

  const largeScale = Math.min(1.6, 1 + percobaan * 0.1);
  yesButton.style.transform = "scale(" + largeScale + ")";

if (percobaan== 1) {
  answers.textContent = "why no?🥲"
  mascot.src = "axolotlWorried.png";
}

if (percobaan== 2) { 
  answers.textContent = "🥺🥺🥺"
}

if (percobaan== 3) {
  answers.textContent = "..."
}

if (percobaan== 4) {
  answers.textContent = "u must drink water Py"
}

if (percobaan== 5) {
  answers.textContent = "hmmm, okay -_-"
  mascot.src = "axolotlDisappointed.png";
}

if (percobaan== 6) {
  answers.textContent = "okay, last chance Py"
}

if (percobaan== 7) {
  answers.textContent = "would u like to drink water now?"
}


  if (percobaan === 7) {
    noButton.style.opacity = "0";
  }



  const maxX = window.innerWidth - noButton.offsetWidth;
  const maxY = window.innerHeight - noButton.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
}
noButton.addEventListener("mouseenter", escaping);
noButton.addEventListener("touchstart", escaping);
</script>

<div class="heart" style="left: 10%; animation-delay: 0s;">❤️</div>
<div class="heart" style="left: 25%; animation-delay: 1s;">❤️</div>
<div class="heart" style="left: 45%; animation-delay: 2s;">❤️</div>
<div class="heart" style="left: 60%; animation-delay: 1s;">❤️</div>
<div class="heart" style="left: 75%; animation-delay: 2s;">❤️</div>
<div class="heart" style="left: 90%; animation-delay: 0s;">❤️</div>
<div class="heart" style="left: 15%; animation-delay: 1.5s;">❤️</div>
<div class="heart" style="left: 35%; animation-delay: 0.5s;">❤️</div>
<div class="heart" style="left: 55%; animation-delay: 1.5s;">❤️</div>
<div class="heart" style="left: 80%; animation-delay: 3s;">❤️</div>
<div class="heart" style="left: 5%; animation-delay: 3.5s;">❤️</div>
<div class="heart" style="left: 40%; animation-delay: 2.5s;">❤️</div>
<div class="heart" style="left: 70%; animation-delay: 0.5s;">❤️</div>



<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>



</body>
</html>
